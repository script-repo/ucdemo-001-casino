# Template only. Copy to shared-resources-secret.yaml (gitignored), fill in, and
# apply. In anything beyond a lab, source these from a secret manager rather
# than a file — see shared-resources/README.md.
#
#   cp shared-resources-secret.example.yaml shared-resources-secret.yaml
#   kubectl apply -n casino-ai-portal -f shared-resources-secret.yaml
#
# Or create it imperatively without a file on disk:
#
#   kubectl create secret generic shared-resources -n casino-ai-portal \
#     --from-literal=PRISM_CENTRAL_PASSWORD='...' \
#     --from-literal=OPENROUTER_API_KEY='...' \
#     --from-literal=NAI_API_KEY='...' \
#     --from-literal=CASINO_DB_PASSWORD='...' \
#     --from-literal=VECTOR_DB_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: shared-resources
  labels:
    app.kubernetes.io/part-of: ai-use-case-portal
type: Opaque
stringData:
  PRISM_CENTRAL_PASSWORD: "REPLACE_ME"
  # Account-wide key. Free-variant rate limits apply per account, so issuing a
  # separate key per use case does not raise the ceiling — it only aids revocation.
  OPENROUTER_API_KEY: "REPLACE_ME"
  NAI_API_KEY: "REPLACE_ME"
  # Per-use-case Postgres role password.
  CASINO_DB_PASSWORD: "REPLACE_ME"
  VECTOR_DB_API_KEY: "REPLACE_ME"
