apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: casino-ai-portal

commonLabels:
  app.kubernetes.io/part-of: casino-ai-use-case-portal

resources:
  - namespace.yaml
  - casino-postgres-pvc.yaml
  - shared-resources-configmap.yaml
  - portal.yaml
  # Each use case with a backend adds its own manifest here. Nothing else in
  # this file changes when a use case is added or removed. None of the six
  # casino use cases has a backend yet, so the list is empty.

# The Secret is deliberately absent: create it out of band so credentials never
# live in Git. See shared-resources-secret.example.yaml.
