apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ucdemo-001-casino
  namespace: db-project-001
spec:
  interval: 1m
  url: https://github.com/script-repo/ucdemo-001-casino.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ucdemo-001-casino
  namespace: db-project-001
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: ucdemo-001-casino
  path: ./deploy/gitops/db-project-001
  prune: true
  wait: true
  targetNamespace: db-project-001
