apiVersion: v1
kind: ServiceAccount
metadata:
  name: casino-ai-portal
---
apiVersion: v1
kind: Secret
metadata:
  name: shared-resource-settings
  annotations:
    # Flux owns the object metadata but merges rather than replacing data keys
    # written by the portal.
    kustomize.toolkit.fluxcd.io/ssa: Merge
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-resource-settings-editor
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["shared-resource-settings"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-resource-settings-editor
subjects:
  - kind: ServiceAccount
    name: casino-ai-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-resource-settings-editor
